<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Health Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header bar -->
    <header class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <!-- SVG logo -->
                <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <span>FitTrack</span>
            </a>
            <div class="d-flex gap-2">
                <a href="register.html" class="btn btn-outline-light btn-sm">Login</a>
                <a href="dashboard.html" class="btn btn-primary btn-sm">Dashboard</a>
            </div>
        </div>
    </header>

    <!-- Main section -->
    <main class="container my-5">
        <!-- Hero section -->
        <section class="text-center py-4">
            <h1 class="fw-bold">Track Fitness Daily</h1>
            <p id="welcome-cookie" class="text-muted">Welcome to your daily health companion</p>
        </section>

        <!-- Media grid -->
        <div class="row g-4 mt-2">
            <!-- Video card -->
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title">Workout Demo</h5>
                    <!-- Video tag -->
                    <video controls width="100%" class="rounded">
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Audio card -->
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title">Motivation Sound</h5>
                    <p class="text-secondary small">Listen for focus during workout</p>
                    <!-- Audio tag -->
                    <audio controls class="w-100">
                        <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg">
                    </audio>
                    <div class="mt-3 text-center">
                        <a href="register.html" class="btn btn-primary">Start Tracking Now</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer bar -->
    <footer class="text-center py-3 bg-white border-top mt-5">
        <small class="text-muted">FitTrack Portal</small>
    </footer>

    <script src="script.js"></script>
</body>
</html>
